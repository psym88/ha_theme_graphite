# Graphite — Home-Assistant-Theme im Farbschema von app_calibri
#
# Farbschema: app_calibri, Standard-Theme „Graphite“ (src/app/app.css, Stand
#             97da5a6) – helle Graustufen auf fast weißem Grund bzw. abgesetzte
#             Karten auf fast schwarzem Grund, Akzent Blau.
# Struktur:   übernommen von catppuccin/home-assistant (2026-11-11), dem
#             gepflegtesten Theme mit vollständigem ha-color-*-Satz; angepasst
#             an Home Assistant Frontend 20261028.6.
#
# Einbau (https://www.home-assistant.io/integrations/frontend/#themes):
#   configuration.yaml
#     frontend:
#       themes: !include_dir_merge_named themes
#   Datei nach config/themes/ legen, HA neu starten, Theme im Profil wählen.
#
# „Graphite“ ist ein Theme für alle drei Modi: Hell/Dunkel/Auto stellt HA ein
# (Profil → Erscheinungsbild bzw. das Menü der Seitenleiste), das Theme folgt
# jeweils dem aktiven Modus.

Graphite:
  modes:
    light:

      # ── Graphite-Rollen ─────────────────────────────────────────
      # Werte aus app_calibri src/app/app.css (Hell: :root, Dunkel: :root.dark),
      # Kommentar rechts nennt die Tailwind-Stufe bzw. Quelle der Rolle.

      graphite-canvas:             "#f2f3f5"   # --background (body, ohne @layer: schlägt bg-slate-50)
      graphite-canvas-alt:         "#e9ebee"   # slate-950 (unterste Ebene)
      graphite-card:               "#ffffff"   # --sheet-bg / bg-white
      graphite-sidebar:            "#ffffff"   # Sidebar: bg-white
      graphite-surface-2:          "#eceef1"   # slate-100 (hover:bg-slate-100)
      graphite-surface-3:          "#d3d6db"   # slate-200 (hover:bg-slate-200)
      graphite-field:              "#f7f8fa"   # slate-50
      graphite-field-disabled:     "#eceef1"   # slate-100
      graphite-border:             "#d3d6db"   # slate-200
      graphite-border-strong:      "#b3b7bd"   # slate-300
      graphite-text:               "#1f2123"   # slate-900
      graphite-text-secondary:     "#62666e"   # slate-500
      graphite-text-muted:         "#6f737b"   # slate-400
      graphite-text-disabled:      "#91959c"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-icon-off:           "#b3b7bd"   # slate-300
      graphite-on-accent:          "#ffffff"   # text-white
      graphite-accent:             "#4e86ee"   # --color-emerald-500
      graphite-accent-pressed:     "#3f6fc9"   # --color-emerald-700
      graphite-accent-hover:       "#4272ca"   # --color-emerald-600
      graphite-danger:             "#c75450"   # --color-red-500
      graphite-danger-strong:      "#a94744"   # --color-red-600
      graphite-warning:            "#b07e1e"   # --color-amber-500
      graphite-warning-fill:       "#c07c2c"   # --ring-warn
      graphite-info:               "#389fdc"   # --color-sky-400
      graphite-success:            "#3f8f4f"   # --ring-ok
      graphite-violet:             "#964eee"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-indigo:             "#514eee"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-rose:               "#c75078"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-pink:               "#c750a3"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-teal:               "#38dcd2"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-lime:               "#648f3f"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-tint-accent-quiet:  "#f1f5fe"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-tint-accent-normal: "#e3ecfc"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-tint-danger:        "#fbf3f3"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-tint-warning:       "#f7f2e8"   # ergänzt (app.css hat diese Stufe nicht)
      graphite-tint-success:       "#ecf4ed"   # ergänzt (app.css hat diese Stufe nicht)

      # ── HA-Farbpaletten ha-color-* ──────────────────────────────
      # Abgeleitet aus den Rollen. Die neutrale Rampe folgt HAs Richtung in
      # beiden Modi (05 = tiefste Ebene, 95 = hellste), weil ein paar Komponenten
      # ha-color-neutral-* direkt verwenden (Toast, Date Picker, Map-Lineal).
      # Die bunten Rampen folgen app.css: 05-30 = Richtung Textfarbe gemischt,
      # 40/50 = Originalwert, 60-95 = Richtung Kartenfläche (die color-mix-Stufen
      # aus app.css sitzen dort). Im Dunkelen ist diese Richtung umgekehrt, weil
      # Tönungen dort auf dunkler Karte liegen - HAs Semantik-Ebene ist deshalb
      # vollständig ausgeschrieben und verweist auf Rollen, nicht auf Rampen.

      ha-color-primary-05: "#263041"
      ha-color-primary-10: "#2d3f60"
      ha-color-primary-20: "#365488"
      ha-color-primary-30: "#3f6fc9"
      ha-color-primary-40: "#4e86ee"
      ha-color-primary-50: "#6395f0"
      ha-color-primary-60: "#7ca5f2"
      ha-color-primary-70: "#98b9f5"
      ha-color-primary-80: "#b8cff8"
      ha-color-primary-90: "#e3ecfc"
      ha-color-primary-95: "#f1f5fe"
      ha-color-neutral-05: "#1f2123"
      ha-color-neutral-10: "#2f3237"
      ha-color-neutral-20: "#3d4046"
