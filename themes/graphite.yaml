      ha-color-orange-80:  "#dfcba5"
      ha-color-orange-90:  "#eee3ce"
      ha-color-orange-95:  "#f7f2e8"
      ha-color-red-05:     "#38292a"
      ha-color-red-10:     "#513030"
      ha-color-red-20:     "#733a3a"
      ha-color-red-30:     "#a94744"
      ha-color-red-40:     "#c75450"
      ha-color-red-50:     "#ce6965"
      ha-color-red-60:     "#d6807e"
      ha-color-red-70:     "#df9c9a"
      ha-color-red-80:     "#e9bbb9"
