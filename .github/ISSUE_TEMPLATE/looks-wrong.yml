name: Something looks wrong
description: A surface, icon or dialog that Graphite colours badly or not at all
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        One thing per issue: a fix for one surface is easy to check, a list of four is not.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      multiple: true
      options:
        - light
        - dark
        - both
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Which part of the interface
      placeholder: >-
        More-info dialog of a light, energy dashboard, settings under automations,
        logbook, a community card, ...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you see, and what you expected
      placeholder: >-
        The tooltip text is unreadable: dark text on the dark tooltip background.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag an image in. One per mode says more than a paragraph.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.1"
  - type: input
    id: frontend_version
    attributes:
      label: Frontend version
      description: Settings, about page
      placeholder: "20261028.6"
  - type: input
    id: theme_version
    attributes:
      label: Graphite version
      description: Settings, Marketplace, Graphite
      placeholder: "1.0.0"
